# Local development database. Credentials are for local use only.
# Fixed project name, so the container/volume names do not depend on the folder name.
name: auto-lincoln
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autolincoln
      POSTGRES_PASSWORD: autolincoln
      POSTGRES_DB: autolincoln
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autolincoln -d autolincoln']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
